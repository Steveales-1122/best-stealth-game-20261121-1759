<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Lantern Heist — The Quiet Archive</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640" aria-label="Lantern Heist: a top-down stealth game. Sneak past the guards, gather the lantern seals, and slip out the exit unseen."></canvas>
  <div id="hud">
    <div class="hud-left">
      <span id="hud-level">Level 1 — The Quiet Archive</span>
      <span id="hud-seals">Seals 0/3</span>
    </div>
    <div class="hud-mid">
      <span id="hud-alert-label">CALM</span>
      <div id="hud-alert-bar"><div id="hud-alert-fill"></div></div>
    </div>
    <div class="hud-right">
      <span id="hud-time">00:00</span>
      <button id="hud-sound" type="button" title="Toggle sound">Sound: on</button>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <div id="overlay"></div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./main.js"></script>
</body>
</html>
